<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ducoro 同步</title>
  <link rel="stylesheet" href="style.css">
  <script src="_magpie/bridge.js"></script>
  <script src="model.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-panel="true">
  <main class="console compact">
    <div class="card-heading"><div><span class="eyebrow">DUCORO · 0.3.2</span><h1>同步设置</h1></div><span class="pill">配置</span></div>
    <p>管理同步开关。Bot 分配、模型映射与报告导入请打开侧边栏「Ducoro 控制台」。</p>
    <div id="message" class="notice" role="status" aria-live="polite" hidden></div>
    <div id="switches" class="switch-grid"></div>
    <p id="connection-state" class="footnote">正在读取插件配置…</p>
    <footer id="save-bar" class="save-bar"><span id="dirty-state">正在加载…</span><div><button type="button" id="reload" class="secondary" disabled>重新读取</button><button type="button" id="save" class="primary" disabled>保存设置</button></div></footer>
  </main>
</body>
</html>
